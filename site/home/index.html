<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant Alex · Library Board</title>
<meta name="description" content="The library as a board: subjects as frames, topics as cards, every source inside. Pan and zoom around it.">
<link rel="icon" href="static/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&family=Source+Sans+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script>
  (function () {
    let t = null
    try { t = localStorage.getItem("theme") } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
    document.documentElement.setAttribute("saved-theme", t)
  })()
</script>
<style>
  :root {
    --bg: #f3f1ee; --dot: #d9d5d0; --panel: #ffffff; --card: #ffffff; --ink: #2b2b2b; --ink2: #4e4e4e; --muted: #7d7d7d;
    --line: #e2dfdb; --accent: #284b63; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06); --mark: #fff23699;
  }
  :root[saved-theme="dark"] {
    --bg: #131315; --dot: #2a2a2e; --panel: #1d1d20; --card: #232327; --ink: #ebebec; --ink2: #d0d0d2; --muted: #8b8b90;
    --line: #333136; --accent: #7b97aa; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --mark: #b3aa0277;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Source Sans Pro", system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }

  /* ── canvas ── */
  #viewport { position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 24px 24px; }
  #viewport:active { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #links path { fill: none; stroke-width: 2.2; opacity: 0.85; }

  .frame { position: absolute; border-radius: 18px; background: color-mix(in srgb, var(--c) 7%, var(--bg));
    border: 2px solid color-mix(in srgb, var(--c) 45%, transparent); }
  .frame > .fh { position: absolute; left: 0; right: 0; top: 0; height: 120px; padding: 20px 26px 0; cursor: pointer; }
  .fh .num { font-family: "Schibsted Grotesk", sans-serif; font-weight: 700; color: var(--c); font-size: 30px; margin-right: 10px; }
  .fh .ttl { font-family: "Schibsted Grotesk", sans-serif; font-weight: 700; font-size: 30px; color: var(--ink); }
  .fh .meta { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .fh .about { color: var(--ink2); font-size: 15px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .fh:hover .ttl { color: var(--accent); }
  /* big label shown only when zoomed far out */
  .frame > .big { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; cursor: pointer; }
  .big .bn { font-family: "Schibsted Grotesk", sans-serif; font-weight: 700; color: var(--c); font-size: 120px; line-height: 1; }
  .big .bt { font-family: "Schibsted Grotesk", sans-serif; font-weight: 700; font-size: 84px; line-height: 1.05; color: var(--ink); max-width: 100%; }
  .big .bc { color: var(--muted); font-size: 48px; margin-top: 18px; }

  .topic { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .topic > .th { height: 78px; padding: 10px 14px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
  .th .tt { font-weight: 700; font-size: 16px; line-height: 1.2; display: flex; justify-content: space-between; gap: 8px; }
  .th .tt span:last-child { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
  .th .ta { color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .th:hover .tt span:first-child { color: var(--accent); }

  .card { position: absolute; width: 236px; height: 56px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--tc);
    border-radius: 8px; padding: 6px 9px 0 9px; cursor: pointer; overflow: hidden; transition: box-shadow .15s, opacity .15s; }
  .card:hover { box-shadow: 0 0 0 2px var(--accent); }
  .card .ct { font-weight: 600; font-size: 13.5px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .cm { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .card.one .ct { -webkit-line-clamp: 1; }
  .card .lk { position: absolute; right: 6px; bottom: 4px; font-size: 10.5px; color: var(--muted); background: var(--card); padding-left: 4px; }
  .card.sel { box-shadow: 0 0 0 3px var(--accent); z-index: 3; }
  .card.rel { box-shadow: 0 0 0 2px var(--tc); }
  .card.hit { background: var(--mark); }
  #world.focus .card:not(.sel):not(.rel) { opacity: 0.28; }
  #world.searching .card:not(.hit) { opacity: 0.22; }

  /* semantic zoom */
  #world.far .frame > .big { display: flex; }
  #world.far .frame > :not(.big) { visibility: hidden; }
  #world.mid .card .ct, #world.mid .card .cm, #world.mid .card .lk { visibility: hidden; }
  #world.mid .card { border-left-width: 236px; }

  /* ── chrome ── */
  header { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px 0; display: flex; gap: 10px; align-items: flex-start;
    pointer-events: none; flex-wrap: wrap; }
  header > * { pointer-events: auto; }
  .brand { background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; box-shadow: var(--shadow); margin-right: auto; }
  .brand h1 { margin: 0; font-family: "Schibsted Grotesk", sans-serif; font-size: 21px; color: var(--accent); line-height: 1.1; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .search { position: relative; width: 300px; max-width: calc(100vw - 36px); }
  .search input { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: inherit; font-size: 15px; outline: none; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 12px; width: 15px; height: 15px; stroke: var(--muted); }
  .results { position: absolute; top: 44px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; display: none; }
  .results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; cursor: pointer;
    border-bottom: 1px solid var(--line); font-size: 14px; }
  .results button:hover, .results button.on { background: var(--bg); }
  .results small { display: block; color: var(--muted); font-size: 12px; }
  .btn { height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow);
    font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--accent); text-decoration: none; }

  .zoom { position: fixed; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .btn { width: 38px; justify-content: center; padding: 0; font-size: 18px; }
  .legend { position: fixed; left: 66px; bottom: 18px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); font-size: 12.5px; color: var(--ink2); display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100vw - 300px); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; }
  #mini { position: fixed; right: 18px; bottom: 18px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); cursor: pointer; }

  .panel { position: fixed; top: 70px; right: 18px; width: 370px; max-height: calc(100vh - 260px); overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: none; z-index: 5; }
  .panel.open { display: block; }
  .panel .x { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .panel .crumb { font-size: 12px; color: var(--muted); }
  .panel h3 { font-family: "Schibsted Grotesk", sans-serif; font-size: 19px; line-height: 1.25; margin: 6px 0 4px; }
  .panel .m { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .panel p { color: var(--ink2); font-size: 14.5px; line-height: 1.5; margin: 0 0 10px; }
  .panel .acts { display: flex; gap: 8px; margin-bottom: 8px; }
  .panel .acts a { box-shadow: none; }
  .panel .acts a.pri { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .panel h4 { margin: 10px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .panel ul { list-style: none; padding: 0; margin: 0; }
  .panel li button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px;
    cursor: pointer; font-size: 13.5px; line-height: 1.3; }
  .panel li button:hover { background: var(--bg); }
  .panel li small { color: var(--muted); display: block; font-size: 11.5px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px;
    padding: 1px 6px; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
  .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: var(--muted); font-size: 13px;
    background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 12px; border-radius: 99px; pointer-events: none; transition: opacity .6s; }

  @media (max-width: 760px) {
    .legend, .hint { display: none; }
    #mini { display: none; }
    .search { width: 100%; order: 5; }
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 60vh; border-radius: 14px 14px 0 0; }
  }
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="links"></svg></div></div>

<header>
  <div class="brand"><h1>Quant Alex</h1><p id="stats">The library as a board</p></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a source, author, idea…  ( / )" autocomplete="off" aria-label="Search">
    <div class="results" id="results"></div>
  </div>
  <a class="btn" href="library">Outline</a>
  <a class="btn" href="map">Map</a>
  <button class="btn" id="theme" aria-label="Toggle dark mode">◐</button>
</header>

<div class="zoom">
  <button class="btn" id="zin" title="Zoom in">+</button>
  <button class="btn" id="zout" title="Zoom out">−</button>
  <button class="btn" id="fit" title="Fit everything">⤢</button>
</div>
<div class="legend" id="legend"></div>
<canvas id="mini" width="220" height="150" aria-label="Overview"></canvas>
<aside class="panel" id="panel"></aside>
<div class="hint" id="hint">Drag to move · scroll or pinch to zoom · click a subject to fly in</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const PALETTE = ["#4e79a7", "#e8a33d", "#e15759", "#59a14f", "#9c6ade", "#2fa9b8", "#f28e2b", "#3a9c86", "#b07aa1", "#e05aa8"]
const TYPES = { Paper: "#4e79a7", Book: "#9c6ade", Lecture: "#2fa9b8", Article: "#e8a33d", Strategy: "#59a14f", Video: "#e05aa8" }
// geometry (world px)
const CW = 236, CH = 56, CG = 8, TP = 12, TH = 78, COLW = CW + 2 * TP, TG = 20, FP = 28, FH = 120, FG = 90, MAXROW = 3300, SPLIT = 9
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))
const $ = (id) => document.getElementById(id)
const world = $("world"), viewport = $("viewport"), panel = $("panel")
let byId, leaves = [], frames = [], zoom, view = d3.zoomIdentity, W = 0, H = 0, selected = null

fetch("graph.json").then((r) => r.json()).then(init)

function init(data) {
  byId = new Map(data.nodes.map((n) => [n.id, n]))
  for (const n of data.nodes) { n.cites = []; n.citedBy = []; n.children = [] }
  for (const e of data.edges) {
    const s = byId.get(e.source), t = byId.get(e.target)
    if (e.kind === "cite") { s.cites.push(t); t.citedBy.push(s) } else s.children.push(t)
  }
  const sections = data.nodes.filter((n) => n.kind === "section").sort((a, b) => (a.num || "99").localeCompare(b.num || "99"))
  sections.forEach((s, i) => (s.color = PALETTE[i % PALETTE.length]))
  for (const n of data.nodes) {
    n.color = byId.get(n.section).color
    if (n.kind === "media") { n.mtype = n.type; n.type = "Video" }
    if (n.kind === "note" || n.kind === "media") leaves.push(n)
  }
  const notes = leaves.filter((n) => n.kind === "note").length
  $("stats").textContent = `${notes} notes · ${leaves.length - notes} recordings · ${sections.length} subjects`
  $("legend").innerHTML = Object.entries(TYPES).map(([t, c]) => `<span><i style="background:${c}"></i>${t === "Video" ? "Video / talk" : t}</span>`).join("")

  layout(sections)
  render(sections)
  setupZoom()
  setupSearch()
  $("theme").onclick = () => {
    const t = document.documentElement.getAttribute("saved-theme") === "dark" ? "light" : "dark"
    document.documentElement.setAttribute("saved-theme", t)
    try { localStorage.setItem("theme", t) } catch (e) {}
    drawMini()
  }
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { select(null); $("results").style.display = "none" }
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus() }
  })
  setTimeout(() => ($("hint").style.opacity = 0), 6000)
  const h = decodeURIComponent(location.hash.slice(1))
  if (h && byId.has(h)) { const n = byId.get(h); n.kind === "section" || n.kind === "topic" ? flyTo(n, false) : select(n, true, false) }
  else fit(false)
}

/* ── deterministic layout: frames in learning-path order, topics masonry-packed inside ── */
function layout(sections) {
  for (const s of sections) {
    const groups = []
    const direct = s.children.filter(isLeaf)
    if (direct.length) groups.push({ title: s.kind === "section" && s.children.some((m) => m.kind === "topic") ? "Also in this section" : "Sources", about: "", items: direct, node: null })
    for (const t of s.children.filter((m) => m.kind === "topic"))
      groups.push({ title: (t.num ? t.num + " · " : "") + t.title, about: t.about || "", items: t.children.filter(isLeaf), node: t })
    for (const g of groups) {
      g.span = g.items.length > SPLIT ? 2 : 1
      g.rows = Math.ceil(g.items.length / g.span)
      g.w = g.span * CW + (g.span - 1) * CG + 2 * TP
      g.h = TH + TP + g.rows * (CH + CG) - CG + TP
    }
    const cols = Math.max(1, Math.min(groups.reduce((a, g) => a + g.span, 0), groups.length >= 5 ? 4 : 3))
    const colH = new Array(cols).fill(0)
    for (const g of groups) {                       // masonry: earliest-ending slot that fits the span
      let best = 0, bestH = Infinity
      for (let c = 0; c + g.span <= cols; c++) {
        const h = Math.max(...colH.slice(c, c + g.span))
        if (h < bestH - 0.5) { bestH = h; best = c }
      }
      g.x = FP + best * (COLW + TG); g.y = FH + bestH
      for (let c = best; c < best + g.span; c++) colH[c] = bestH + g.h + TG
      g.items.forEach((n, i) => {
        const col = g.span === 2 ? (i < g.rows ? 0 : 1) : 0, row = g.span === 2 ? i % g.rows : i
        n.lx = g.x + TP + col * (CW + CG); n.ly = g.y + TH + TP + row * (CH + CG)
      })
    }
    s.groups = groups
    s.w = FP * 2 + cols * COLW + (cols - 1) * TG
    s.h = FH + Math.max(...colH) - TG + FP
  }
  // frames: shelf rows in order
  let x = 0, y = 0, rowH = 0
  for (const s of sections) {
    if (x > 0 && x + s.w > MAXROW) { x = 0; y += rowH + FG; rowH = 0 }
    s.x = x; s.y = y; x += s.w + FG; rowH = Math.max(rowH, s.h)
    for (const g of s.groups) { g.ax = s.x + g.x; g.ay = s.y + g.y; if (g.node) Object.assign(g.node, { x: g.ax, y: g.ay, w: g.w, h: g.h }) }
    for (const g of s.groups) for (const n of g.items) { n.x = s.x + n.lx; n.y = s.y + n.ly; n.w = CW; n.h = CH }
  }
  frames = sections
}
const isLeaf = (n) => n.kind === "note" || n.kind === "media"
function countLeaves(n) { let c = 0; const w = (m) => { if (isLeaf(m)) c++; m.children.forEach(w) }; w(n); return c }

function render(sections) {
  const W_ = Math.max(...sections.map((s) => s.x + s.w)), H_ = Math.max(...sections.map((s) => s.y + s.h))
  world.style.width = W_ + "px"; world.style.height = H_ + "px"
  const svg = $("links"); svg.setAttribute("width", W_); svg.setAttribute("height", H_)
  const frag = document.createDocumentFragment()
  for (const s of sections) {
    const f = document.createElement("div")
    f.className = "frame"
    Object.assign(f.style, { left: s.x + "px", top: s.y + "px", width: s.w + "px", height: s.h + "px" })
    f.style.setProperty("--c", s.color)
    const k = countLeaves(s), t = s.groups.filter((g) => g.node).length
    f.innerHTML = `<div class="fh"><span class="num">${esc(s.num || "▸")}</span><span class="ttl">${esc(s.title)}</span>
      <div class="meta">${t ? `${t} topics · ` : ""}${k} sources</div>${s.about ? `<div class="about">${esc(s.about)}</div>` : ""}</div>
      <div class="big"><div class="bn">${esc(s.num || "▸")}</div><div class="bt">${esc(s.title)}</div><div class="bc">${t ? `${t} topics · ` : ""}${k} sources</div></div>`
    f.querySelector(".fh").onclick = () => flyTo(s)
    f.querySelector(".big").onclick = () => flyTo(s)
    s.el = f
    for (const g of s.groups) {
      const tdiv = document.createElement("div")
      tdiv.className = "topic"
      Object.assign(tdiv.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px" })
      tdiv.innerHTML = `<div class="th"><div class="tt"><span>${esc(g.title)}</span><span>${g.items.length}</span></div>
        ${g.about ? `<div class="ta">${esc(g.about)}</div>` : ""}</div>`
      tdiv.querySelector(".th").onclick = () => flyTo(g.node || { x: g.ax, y: g.ay, w: g.w, h: g.h })
      f.appendChild(tdiv)
      for (const n of g.items) {
        const c = document.createElement("div")
        c.className = "card"
        Object.assign(c.style, { left: n.lx + "px", top: n.ly + "px" })
        c.style.setProperty("--tc", TYPES[n.type])
        const meta = [(n.authors || "").replace(/\s*\([^)]*\)/g, ""), n.year].filter(Boolean).join(" · ") || (n.mtype || n.type)
        const links = n.cites.length + n.citedBy.length
        c.innerHTML = `<div class="ct">${esc(n.title)}</div><div class="cm">${esc(meta)}</div>${links ? `<span class="lk">↔ ${links}</span>` : ""}`
        c.title = n.title
        c.onclick = (e) => { e.stopPropagation(); select(n) }
        c.ondblclick = (e) => { e.stopPropagation(); open(n) }
        n.el = c
        f.appendChild(c)
      }
    }
    frag.appendChild(f)
  }
  world.insertBefore(frag, $("links"))
}
function open(n) { n.kind === "media" ? window.open(n.url, "_blank", "noopener") : (location.href = n.url) }

/* ── pan / zoom ── */
function setupZoom() {
  zoom = d3.zoom().scaleExtent([0.04, 2.5])
    .filter((e) => !e.target.closest(".panel") && (e.type !== "dblclick") && (!e.button || e.type === "wheel"))
    .on("zoom", (e) => {
      view = e.transform
      world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`
      world.classList.toggle("far", view.k < 0.3)
      world.classList.toggle("mid", view.k >= 0.3 && view.k < 0.55)
      viewport.style.backgroundSize = `${24 * view.k}px ${24 * view.k}px`
      viewport.style.backgroundPosition = `${view.x}px ${view.y}px`
      drawMini()
    })
  d3.select(viewport).call(zoom).on("dblclick.zoom", null)
  viewport.addEventListener("click", (e) => { if (e.target === viewport || e.target === world || e.target.classList.contains("frame")) select(null) })
  $("zin").onclick = () => d3.select(viewport).transition().duration(250).call(zoom.scaleBy, 1.5)
  $("zout").onclick = () => d3.select(viewport).transition().duration(250).call(zoom.scaleBy, 1 / 1.5)
  $("fit").onclick = () => { select(null); fit(true) }
  window.addEventListener("resize", () => { W = innerWidth; H = innerHeight; drawMini() })
  W = innerWidth; H = innerHeight
  $("mini").onclick = (e) => {
    const r = $("mini").getBoundingClientRect(), m = miniScale()
    const wx = (e.clientX - r.left - m.ox) / m.s, wy = (e.clientY - r.top - m.oy) / m.s
    d3.select(viewport).transition().duration(400).call(zoom.translateTo, wx, wy)
  }
}
function box(x, y, w, h, animate = true, pad = 60, kMax = 1.4) {
  const top = innerWidth < 760 ? 120 : 70, right = panel.classList.contains("open") && innerWidth > 760 ? 400 : 0
  const vw = innerWidth - right, vh = innerHeight - top
  const k = Math.min(kMax, (vw - 2 * pad) / w, (vh - 2 * pad) / h)
  const t = d3.zoomIdentity.translate(vw / 2 - k * (x + w / 2), top + vh / 2 - k * (y + h / 2)).scale(k)
  const sel = d3.select(viewport)
  ;(animate ? sel.transition().duration(650) : sel).call(zoom.transform, t)
}
function fit(animate = true) {
  const w = parseFloat(world.style.width), h = parseFloat(world.style.height)
  box(0, 0, w, h, animate, 40)
}
function flyTo(n, animate = true) { box(n.x, n.y, n.w, n.h, animate, 40, n.kind === "section" ? 1 : 1.3) }

/* ── selection: panel + connector lines ── */
function where(m) {
  const s = byId.get(m.section)
  const pid = m.kind === "media" ? m.id.split("/")[0] : m.id.split("/").slice(0, -1).join("/")
  const t = byId.get(pid)
  return [(s.num ? s.num + " " : "") + s.title, t && t.kind === "topic" ? t.title : ""].filter(Boolean).join(" › ")
}
function select(n, zoomTo = false, animate = true) {
  if (selected) selected.el.classList.remove("sel")
  document.querySelectorAll(".card.rel").forEach((c) => c.classList.remove("rel"))
  $("links").innerHTML = ""
  selected = n
  world.classList.toggle("focus", !!n)
  if (!n) { panel.classList.remove("open"); history.replaceState(null, "", location.pathname); return }
  history.replaceState(null, "", "#" + encodeURIComponent(n.id))
  n.el.classList.add("sel")
  const rel = [...n.cites, ...n.citedBy].filter(isLeaf)
  rel.forEach((m) => m.el.classList.add("rel"))
  // connectors from the selected card to each related card
  const svg = $("links")
  for (const m of rel) {
    const a = { x: n.x + CW / 2, y: n.y + CH / 2 }, b = { x: m.x + CW / 2, y: m.y + CH / 2 }
    const dx = (b.x - a.x) * 0.5
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path")
    p.setAttribute("d", `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`)
    p.setAttribute("stroke", n.cites.includes(m) ? "var(--accent)" : m.color)
    p.setAttribute("stroke-dasharray", n.cites.includes(m) ? "" : "6 5")
    svg.appendChild(p)
  }
  const meta = [n.kind === "media" ? n.mtype : "", (n.authors || "").replace(/\s*\([^)]*\)/g, ""), n.year].filter(Boolean).map(esc).join(" · ")
  const list = (arr) => `<ul>${arr.map((m) => `<li><button data-id="${esc(m.id)}">${esc(m.title)}<small>${esc(where(m))}</small></button></li>`).join("")}</ul>`
  panel.innerHTML = `<button class="x" aria-label="Close">×</button><div class="crumb">${esc(where(n))}</div>
    <h3>${esc(n.title)}</h3><div class="m"><span class="badge" style="--tc:${TYPES[n.type]}">${esc(n.mtype || n.type)}</span> ${meta}</div>
    ${n.summary && n.kind !== "media" ? `<p>${esc(n.summary)}</p>` : ""}
    <div class="acts"><a class="btn pri" href="${esc(n.url)}"${n.kind === "media" ? ' target="_blank" rel="noopener"' : ""}>${n.kind === "media" ? "Watch / open ↗" : "Read the note →"}</a>
    ${n.pdf ? `<a class="btn" href="${esc(n.pdf)}">PDF</a>` : ""}</div>
    ${n.cites.length ? `<h4>${n.kind === "media" ? "With" : "Builds on"} (${n.cites.length}) — solid lines</h4>${list(n.cites)}` : ""}
    ${n.citedBy.length ? `<h4>Referenced by (${n.citedBy.length}) — dashed lines</h4>${list(n.citedBy)}` : ""}
    ${!rel.length && !n.cites.length && !n.citedBy.length ? `<p style="color:var(--muted);font-size:13px">Not linked to other sources yet.</p>` : ""}`
  panel.classList.add("open")
  panel.scrollTop = 0
  panel.querySelector(".x").onclick = () => select(null)
  panel.querySelectorAll("li button").forEach((b) => (b.onclick = () => { const m = byId.get(b.dataset.id); isLeaf(m) ? select(m, true) : flyTo(m) }))
  if (zoomTo) {
    if (rel.length) {
      const xs = [n, ...rel].map((m) => m.x), ys = [n, ...rel].map((m) => m.y)
      const x0 = Math.min(...xs), y0 = Math.min(...ys), x1 = Math.max(...xs) + CW, y1 = Math.max(...ys) + CH
      box(x0, y0, x1 - x0, y1 - y0, animate, 80, 1.2)
    } else box(n.x - 300, n.y - 200, CW + 600, CH + 400, animate, 40, 1.2)
  }
}

/* ── search ── */
function setupSearch() {
  const q = $("q"), box_ = $("results")
  let hits = [], cur = 0
  for (const n of leaves) n.hay = [n.title, n.authors, n.summary, n.year, n.type, n.mtype, where(n)].join(" ").toLowerCase()
  const render_ = () => {
    box_.innerHTML = hits.map((n, i) => `<button class="${i === cur ? "on" : ""}" data-id="${esc(n.id)}">${esc(n.title)}<small>${esc(where(n))}</small></button>`).join("")
    box_.style.display = hits.length ? "block" : "none"
    box_.querySelectorAll("button").forEach((b) => (b.onmousedown = (e) => { e.preventDefault(); pick(byId.get(b.dataset.id)) }))
  }
  const pick = (n) => { box_.style.display = "none"; q.blur(); world.classList.remove("searching"); leaves.forEach((m) => m.el.classList.remove("hit")); select(n, true) }
  q.addEventListener("input", () => {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean)
    const all = terms.length ? leaves.filter((n) => terms.every((w) => n.hay.includes(w))) : []
    leaves.forEach((n) => n.el.classList.toggle("hit", all.includes(n)))
    world.classList.toggle("searching", terms.length > 0)
    hits = all.slice(0, 10); cur = 0; render_()
  })
  q.addEventListener("keydown", (e) => {
    if (!hits.length) return
    if (e.key === "ArrowDown") { cur = (cur + 1) % hits.length; render_(); e.preventDefault() }
    if (e.key === "ArrowUp") { cur = (cur - 1 + hits.length) % hits.length; render_(); e.preventDefault() }
    if (e.key === "Enter") pick(hits[cur])
  })
  q.addEventListener("blur", () => setTimeout(() => (box_.style.display = "none"), 150))
}

/* ── minimap ── */
function miniScale() {
  const c = $("mini"), w = parseFloat(world.style.width), h = parseFloat(world.style.height)
  const s = Math.min((c.width - 16) / w, (c.height - 16) / h)
  return { s, ox: (c.width - w * s) / 2, oy: (c.height - h * s) / 2 }
}
function drawMini() {
  const c = $("mini"); if (!frames.length) return
  const ctx = c.getContext("2d"), m = miniScale()
  ctx.clearRect(0, 0, c.width, c.height)
  for (const f of frames) {
    ctx.fillStyle = f.color + "55"; ctx.strokeStyle = f.color
    ctx.fillRect(m.ox + f.x * m.s, m.oy + f.y * m.s, f.w * m.s, f.h * m.s)
    ctx.strokeRect(m.ox + f.x * m.s, m.oy + f.y * m.s, f.w * m.s, f.h * m.s)
  }
  const vx = -view.x / view.k, vy = -view.y / view.k, vw = innerWidth / view.k, vh = innerHeight / view.k
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink"); ctx.lineWidth = 1.5
  ctx.strokeRect(m.ox + vx * m.s, m.oy + vy * m.s, vw * m.s, vh * m.s)
}
</script>
